  <!-- legend -->
  <rect x="20" y="595" width="1060" height="115" rx="6" fill="#fafafa" stroke="#aaa"/>
  <text x="32" y="615" class="lbl">Legend:</text>
  <text x="32" y="632" class="small">yellow row = SC-bearing (acceptance criterion test). white/light-grey = supporting unit/integration.</text>
  <text x="32" y="648" class="small">Each row maps F/SC-id → test file path → test function name → fixture/double consumed.</text>
  <text x="32" y="664" class="small">Patterns in use: Table-driven (gates, parsers, factory), Spy (hooks), Fake (writer/post-proc), Stub (parsers/encoder),</text>
  <text x="32" y="680" class="small">Property/Fuzz (encoder), Golden Master (JSON), Test Harness (bench), Subtests (t.Run per case).</text>
  <text x="32" y="696" class="small">Story-cuttable: every row = 1 task-slicer story (one file, ≤ 300 LOC, single F/SC).</text>
</svg>
