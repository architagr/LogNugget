<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="monospace" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <style>
      .stage{fill:#eef; stroke:#224; stroke-width:1.2;}
      .gate{fill:#ffe; stroke:#a80; stroke-width:1.2;}
      .pool{fill:#efe; stroke:#262; stroke-width:1.2;}
      .async{fill:#fee; stroke:#822; stroke-width:1.2; stroke-dasharray:4 3;}
      .ns{fill:#000; font-weight:bold;}
      .lbl{fill:#222;}
      .ttl{font-size:14px; font-weight:bold;}
    </style>
  </defs>

  <text x="20" y="22" class="ttl">Hot-path flow: caller goroutine, ns budget per stage (target sum &lt; 1000 ns)</text>

  <!-- Stage 1: caller -->
  <rect x="20" y="50" width="140" height="60" rx="6" class="stage"/>
  <text x="30" y="72" class="lbl">caller goroutine</text>
  <text x="30" y="90" class="lbl">entry.Info(ctx,...)</text>
  <text x="30" y="106" class="ns">~10 ns</text>

  <!-- Stage 2: pool get -->
  <rect x="190" y="50" width="140" height="60" rx="6" class="pool"/>
  <text x="200" y="72" class="lbl">sync.Pool Get</text>
  <text x="200" y="90" class="lbl">+reset()</text>
  <text x="200" y="106" class="ns">~30 ns</text>

  <!-- Stage 3: level gate -->
  <rect x="360" y="50" width="140" height="60" rx="6" class="gate"/>
  <text x="370" y="72" class="lbl">min-level gate</text>
  <text x="370" y="90" class="lbl">F6, &lt;100 ns filtered</text>
  <text x="370" y="106" class="ns">~5 ns</text>

  <!-- Stage 4: time -->
  <rect x="530" y="50" width="140" height="60" rx="6" class="stage"/>
  <text x="540" y="72" class="lbl">time.Now().UTC()</text>
  <text x="540" y="90" class="lbl">F28 RFC3339</text>
  <text x="540" y="106" class="ns">~80 ns</text>

  <!-- Stage 5: caller (optional) -->
  <rect x="700" y="50" width="160" height="60" rx="6" class="stage"/>
  <text x="710" y="72" class="lbl">runtime.Caller (F17)</text>
  <text x="710" y="90" class="lbl">opt; addSource only</text>
  <text x="710" y="106" class="ns">~250 ns (skip if off)</text>

  <!-- Stage 6: render fields -->
  <rect x="20" y="170" width="200" height="70" rx="6" class="stage"/>
  <text x="30" y="192" class="lbl">render fields into pooled</text>
  <text x="30" y="208" class="lbl">[]byte buffer (F27)</text>
  <text x="30" y="224" class="lbl">ctx parser (F16)</text>
  <text x="30" y="238" class="ns">~250 ns / 16 fields</text>

  <!-- Stage 7: encode -->
  <rect x="250" y="170" width="180" height="70" rx="6" class="stage"/>
  <text x="260" y="192" class="lbl">encoder.Write</text>
  <text x="260" y="208" class="lbl">JSON F10 RFC8259</text>
  <text x="260" y="224" class="lbl">escape table</text>
  <text x="260" y="238" class="ns">~150 ns</text>

  <!-- Stage 8: copy []byte -->
  <rect x="460" y="170" width="180" height="70" rx="6" class="stage"/>
  <text x="470" y="192" class="lbl">copy buf -&gt; LogEvent.Data</text>
  <text x="470" y="208" class="lbl">(buf returns to pool)</text>
  <text x="470" y="238" class="ns">~80 ns</text>

  <!-- Stage 9: ch send -->
  <rect x="670" y="170" width="180" height="70" rx="6" class="stage"/>
  <text x="680" y="192" class="lbl">ch &lt;- LogEvent (F21,F22)</text>
  <text x="680" y="208" class="lbl">buffered, blocking F23</text>
  <text x="680" y="238" class="ns">~120 ns</text>

  <!-- Stage 10: pool put -->
  <rect x="20" y="280" width="200" height="60" rx="6" class="pool"/>
  <text x="30" y="302" class="lbl">LogEntry.Put()</text>
  <text x="30" y="320" class="lbl">return entry to pool</text>
  <text x="30" y="336" class="ns">~25 ns</text>

  <!-- Stage 11: return -->
  <rect x="250" y="280" width="180" height="60" rx="6" class="stage"/>
  <text x="260" y="302" class="lbl">return to caller</text>
  <text x="260" y="320" class="lbl">no IO yet</text>
  <text x="260" y="336" class="ns">total ~750 ns</text>

  <!-- Async island -->
  <rect x="460" y="280" width="390" height="80" rx="6" class="async"/>
  <text x="470" y="302" class="lbl">--- ASYNC: dispatcher goroutine drains ch ---</text>
  <text x="470" y="320" class="lbl">PreProcessor -&gt; hooks(level + LevelUnSet)</text>
  <text x="470" y="338" class="lbl">post-processor batches; ticker/size flush</text>
  <text x="470" y="354" class="lbl">excluded from &lt;1µs hot-path budget (NF1)</text>

  <!-- Budget summary -->
  <rect x="20" y="380" width="830" height="140" rx="6" fill="#fafafa" stroke="#888"/>
  <text x="30" y="402" class="ttl">Budget summary (addSource=false, 16 fields, JSON):</text>
  <text x="30" y="424">pool Get/reset 30 + gate 5 + time 80 + render 250 + encode 150 + buf-copy 80 + ch send 120 + Put 25 = ~740 ns</text>
  <text x="30" y="444">+ caller 10 = ~750 ns. Headroom ~250 ns vs 1000 ns gate. addSource=true adds ~250 ns -&gt; ~1000 ns ceiling exactly; F17 must be lazy.</text>
  <text x="30" y="464">Allocation budget: pool entry (0), pooled buf (0 amortized), ctx map (1), encoded []byte (1), LogEvent send (0). Target: ≤30 allocs, ≤2KB.</text>
  <text x="30" y="484">Lock contention budget: ZERO on caller path. sync.Pool is P-local. Only mutex on dispatcher/post-processor side.</text>
  <text x="30" y="504">Channel-send cost dominates after 250 ns; size buffer to 10 events per F22 — beyond that, scheduler latency leaks into p99.</text>

  <!-- Arrows -->
  <line x1="160" y1="80" x2="190" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="330" y1="80" x2="360" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="500" y1="80" x2="530" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="670" y1="80" x2="700" y2="80" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M780,110 L780,140 L120,140 L120,170" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="220" y1="205" x2="250" y2="205" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="430" y1="205" x2="460" y2="205" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="640" y1="205" x2="670" y2="205" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M760,240 L760,260 L120,260 L120,280" fill="none" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="220" y1="310" x2="250" y2="310" stroke="#222" stroke-width="1.4" marker-end="url(#arr)"/>
  <line x1="430" y1="310" x2="460" y2="310" stroke="#822" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
</svg>
