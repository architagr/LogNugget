name: Bug Report
description: Report a reproducible bug in LogNugget
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal code or steps that trigger the bug.
      placeholder: |
        entry := entry.NewLogEntry()
        entry.Info(ctx, "msg")
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: "go1.21.0"
    validations:
      required: true
  - type: input
    id: lognugget-version
    attributes:
      label: LogNugget version or commit
      placeholder: "v2.0.0"
    validations:
      required: true
