name: Lint
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # v8 is the first action release that understands the v2 config schema
      # used by .golangci.yml. Build tags come from the config file.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
