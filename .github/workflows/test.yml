on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

name: All builds
jobs:
  fmt-vet-test:
    strategy:
      matrix:
        go-version: ["1.22", "1.24", "1.26"]
        platform: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # Go 1.22 test binaries abort at load on the current macOS runner image:
          # "dyld: missing LC_UUID load command", before any test code runs. It is a
          # linker incompatibility between Go < 1.23 and macOS 15+, not something this
          # module can fix. 1.22 is still covered on Linux and Windows, and macOS is
          # covered on 1.24 and 1.26.
          - go-version: "1.22"
            platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Format code
        run: ./.ci.gofmt.sh
      - name: Install dependencies
        run: go mod tidy
      - name: Run go vet
        run: ./.ci.govet.sh
      - name: Run go test
        run: go test ./... -tags testing -race -v -covermode=atomic -shuffle=on
  coverage:
    runs-on: ubuntu-latest
    needs: fmt-vet-test
    steps:
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Calc coverage
        run: |
          go test `go list ./... | grep -v examples` -tags testing -coverprofile=coverage.txt -covermode=atomic -v 2>&1 | tee cover-output.txt
          # Enforce >= 85% per testable package (skip enum/model with no stmts).
          awk '/coverage:/ && !/no statements/ {
            match($0, /coverage: ([0-9.]+)%/, arr);
            pct = arr[1]+0;
            pkg = $0; sub(/ .*/, "", pkg);
            if (pct < 85) { print "COVERAGE FAIL: " pkg " = " pct "% (< 85%)"; fail=1 }
          } END { if (fail) exit 1 }' cover-output.txt
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.txt
          flags: unittests
          name: codecov-umbrella